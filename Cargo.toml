[package]
name = "tz-controller"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Configuration GUI for the tz-custom suite: XRizer AA and DXVK VRS"
repository = "https://github.com/TommyZ-7/tz-controller"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "system_fonts",
    "wayland",
    "x11",
] }
glow = "0.17"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
