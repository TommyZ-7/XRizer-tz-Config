name: AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            patchelf squashfs-tools libfuse2 file unzip \
            fonts-noto-cjk xvfb xdotool imagemagick x11-utils

      - name: Test
        run: cargo test --locked

      - name: Test font fallback
        run: bash scripts/test-appimage-font.sh

      - name: Test release helper
        run: bash scripts/test-github-release.sh

      - name: Build AppImage
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            export VERSION="${TAG_NAME#v}"
          else
            export VERSION="dev-${GITHUB_SHA::7}"
          fi
          bash scripts/build-appimage.sh

      - name: Verify AppImage contents
        run: |
          set -euo pipefail
          APP=$(ls dist/*.AppImage)
          "$APP" --appimage-extract >/dev/null
          for lib in libxkbcommon.so.0 libX11.so.6 libwayland-client.so.0; do
            find squashfs-root/usr/lib -name "$lib" | grep -q . || {
              echo "missing bundled library: $lib"
              exit 1
            }
          done
          if find squashfs-root/usr/lib \( -name 'libGL.so*' -o -name 'libEGL.so*' -o -name 'libdrm.so*' \) | grep -q .; then
            echo "core graphics library was bundled"
            exit 1
          fi
          find squashfs-root/usr/share/doc/tz-controller -name LICENSE | grep -q .
          find squashfs-root/usr/share/fonts -iname 'NotoSansCJK*' | grep -q .
          rm -rf squashfs-root

      - name: Smoke test under Xvfb
        run: |
          set -euo pipefail
          APP=$(readlink -f dist/*.AppImage)
          Xvfb :99 -screen 0 1280x800x24 > xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          APP_PID=""
          cleanup() {
            if [ -n "$APP_PID" ]; then
              kill "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
            fi
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 1
          cd /tmp

          # Normal AppImage execution (FUSE2 is installed on the runner).
          "$APP" > "$OLDPWD/appimage.log" 2>&1 &
          APP_PID=$!
          if ! timeout 30 xdotool search --sync --name "tz-controller"; then
            echo "normal AppImage window did not appear"
            cat "$OLDPWD/appimage.log"
            cat "$OLDPWD/xvfb.log"
            exit 1
          fi
          xdotool search --name "tz-controller" getwindowgeometry
          import -window root "$OLDPWD/appimage-smoke.png"
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          APP_PID=""
          sleep 1

          # Extract-and-run execution for hosts without FUSE2.
          APPIMAGE_EXTRACT_AND_RUN=1 "$APP" > "$OLDPWD/appimage-extract.log" 2>&1 &
          APP_PID=$!
          if ! timeout 30 xdotool search --sync --name "tz-controller"; then
            echo "extract-and-run AppImage window did not appear"
            cat "$OLDPWD/appimage-extract.log"
            exit 1
          fi
          xdotool search --name "tz-controller" getwindowgeometry
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          APP_PID=""

      - name: Upload AppImage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tz-controller-appimage
          path: dist/*.AppImage
          if-no-files-found: ignore

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-smoke
          path: appimage-smoke.png
          if-no-files-found: ignore

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-failure-logs
          path: |
            appimage.log
            appimage-extract.log
            xvfb.log
          if-no-files-found: ignore

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(ls dist/*.AppImage)
          bash scripts/github-release.sh "$GITHUB_REF_NAME" "$APP"
